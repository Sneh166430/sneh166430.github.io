<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaperQuiz — turn a paper into questions</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f2e9;
    --paper-dark: #ece5d4;
    --ink: #23201a;
    --ink-soft: #5c5648;
    --rule: #cabf9f;
    --accent: #8a4a2f;
    --accent-soft: #f0e0d3;
    --good: #3d6b4f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1a15;
      --paper-dark: #262319;
      --ink: #ece5d4;
      --ink-soft: #b8ae95;
      --rule: #46402f;
      --accent: #e0a37e;
      --accent-soft: #332419;
      --good: #8fc9a4;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1a15;
    --paper-dark: #262319;
    --ink: #ece5d4;
    --ink-soft: #b8ae95;
    --rule: #46402f;
    --accent: #e0a37e;
    --accent-soft: #332419;
    --good: #8fc9a4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    line-height: 1.55;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  header.top {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 32px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
    max-width: 54ch;
  }
  .card {
    background: var(--paper-dark);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 28px;
    margin-bottom: 28px;
  }
  .dropzone {
    border: 1.5px dashed var(--rule);
    border-radius: 3px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone p { margin: 0 0 4px; font-size: 16px; }
  .dropzone .hint { color: var(--ink-soft); font-size: 13px; font-family: 'IBM Plex Mono', monospace; }
  input[type=file] { display: none; }
  textarea {
    width: 100%;
    min-height: 120px;
    margin-top: 16px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    resize: vertical;
  }
  textarea:focus, .dropzone:focus-visible, button:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  label.field { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
  select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }
  button.generate {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: .02em;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 12px 22px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 18px;
  }
  button.generate:hover { background: var(--accent); }
  button.generate:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); margin-top: 12px; min-height: 18px; }
  .status.err { color: var(--accent); }

  .results h2 {
    font-size: 20px;
    margin: 0 0 4px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 10px;
  }
  .count { color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin: 0 0 20px; }
  .q {
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 18px 20px;
    margin-bottom: 14px;
    background: var(--paper-dark);
  }
  .q .tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 2px 9px;
    margin-bottom: 10px;
  }
  .q .stem { font-size: 16.5px; }
  .q .blank { border-bottom: 2px solid var(--ink); padding: 0 2px; }
  .q .opts { list-style: none; padding: 0; margin: 12px 0 0; }
  .q .opts li { padding: 6px 10px; border: 1px solid var(--rule); border-radius: 3px; margin-bottom: 6px; font-size: 15px; }
  .reveal-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: none;
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 4px 12px;
    cursor: pointer;
    margin-top: 12px;
  }
  .answer {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    color: var(--good);
    font-size: 15px;
  }
  .answer.show { display: block; }
  footer {
    margin-top: 40px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 16px;
  }
  .empty {
    color: var(--ink-soft);
    font-style: italic;
    padding: 20px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PaperQuiz</h1>
    <p class="sub">Drop in a research paper — get study questions back. Everything runs in your browser; nothing is uploaded anywhere.</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a PDF or text file">
      <p id="dzText">Drop a PDF or .txt file here, or click to choose one</p>
      <p class="hint">PDF · TXT — or paste text below</p>
      <input type="file" id="fileInput" accept=".pdf,.txt">
    </div>
    <textarea id="pasteArea" placeholder="…or paste abstract / section text here instead">
